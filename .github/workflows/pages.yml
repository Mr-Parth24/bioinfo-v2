# Publishes a static preview of the site to GitHub Pages on every push.
# The Pages preview has no CMS backend; the editable app runs from Docker/Node.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, claude/website-update-help-r254ix]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run preview:export
      - run: touch preview/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/pages" > /tmp/pages.json 2> /tmp/pages.err; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=GitHub Pages not enabled::Skipping deploy because GitHub Pages is not enabled for this repository."
            cat /tmp/pages.err
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi
      - id: deployment
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
